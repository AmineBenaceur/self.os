[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "selfos"
dynamic = ["version"]
description = "Turn any AI assistant into a goal coach: a plain-text goals, habits and memory vault with a CLI and MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Amine Benaceur" }]
keywords = ["goals", "habits", "ai-agents", "mcp", "model-context-protocol", "personal-knowledge", "coaching", "openclaw", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AmineBenaceur/self.os"
Issues = "https://github.com/AmineBenaceur/self.os/issues"

[project.scripts]
selfos = "selfos.cli:entry"
selfos-mcp = "selfos.mcp_server:main"

[tool.hatch.version]
path = "selfos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["selfos"]

[tool.hatch.build.targets.wheel.force-include]
"template" = "selfos/template"
"AGENTS.md" = "selfos/AGENTS.md"

[tool.hatch.build.targets.sdist]
include = ["selfos", "template", "AGENTS.md", "README.md", "LICENSE", "docs/demo.png"]
