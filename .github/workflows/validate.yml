name: validate
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (CLI + MCP server)
        run: python -m unittest discover tests -v
      - name: Validate example vault
        run: python tools/selfos.py --vault examples/vault validate
      - name: Install from source and smoke-test
        run: |
          python -m pip install .
          export SELFOS_VAULT="$RUNNER_TEMP/v"
          selfos init
          selfos validate
      - name: Guard against committed personal data
        run: |
          if git ls-files | grep -E '^vault/'; then
            echo "::error::Files under vault/ are committed. Remove them with: git rm -r --cached vault"
            exit 1
          fi
